name: Release

# A tag is what publishes a release, and the build is what attaches the binary to it: a
# release cannot exist half-finished, because it is created as a draft and only published
# once the archive and `SHA256SUMS.txt` are on it.
#
# One platform: Windows x86_64, as a folder zipped whole. The code is not Windows-only —
# the gate compiles and lints the Linux and macOS targets, which is where a `#[cfg]`
# mistake or a lint that only exists on one platform gets caught — but the release is the
# build the person actually runs, and the one they run is the Windows one. An archive
# nobody executes is an artifact that only pretends to have been tested.
#
# The Windows build links the C runtime statically, so the binary runs on a machine with
# no redistributable installed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach binaries to'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  STEM: vn-finance
  # `prepare` and `checksums` publish without checking the repository out, and `gh`
  # otherwise reads the repository from the git remote it cannot find: "failed to run
  # git: fatal: not a git repository". Naming the repository is what the GitHub CLI asks
  # for in that case.
  GH_REPO: ${{ github.repository }}

jobs:
  # The gate calls the workflow a pull request runs rather than a copy of it, so the two
  # cannot drift: a red check stops the release here, before a draft exists to be
  # published.
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Prepare release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          cat > notes.md <<EOF
          Um assistente fiscal local para quem trabalha por conta própria. Uma janela, uma
          pasta de dados, sem rede.

          Descarrega o ficheiro, confirma-o contra o \`SHA256SUMS.txt\`, e executa-o. Não há
          nada a instalar: a aplicação abre o cofre em \`~/.vn-finance\`
          (\`%USERPROFILE%\\.vn-finance\` no Windows) e cria-o no primeiro arranque.

          | Sistema | Ficheiro |
          | --- | --- |
          | Windows 10/11, 64 bits | \`${STEM}-${VERSION}-windows-x86_64.zip\` |

          O binário linka a runtime C estaticamente, por isso corre numa máquina sem
          redistribuível instalado.

          O código-fonte deste ficheiro é a etiqueta \`${TAG}\`, sob a GNU AGPL v3.
          EOF
          gh release create "$TAG" --draft --title "${STEM} ${VERSION}" --notes-file notes.md

  build:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            system: windows
            arch: x86_64
            ext: zip
            rustflags: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p vnfin --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME="${STEM}-${VERSION}-${{ matrix.system }}-${{ matrix.arch }}"
          ROOT="${STEM}-${VERSION}"
          mkdir -p "dist/${ROOT}"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "dist/${ROOT}/"
          cp "target/${{ matrix.target }}/release/vnfin.exe" "dist/${ROOT}/"
          # The rule pack is a folder the binary reads, not only a constant it carries.
          # Shipping it beside the executable is what lets a new year — or a corrected
          # pack — arrive as a file, checked against the SHA-256 the page prints, without
          # a new release of the application. It is also the copy the Regras page points
          # at when it says where the law on screen came from.
          cp -r rules "dist/${ROOT}/rules"
          # bsdtar writes forward-slash entries; the GNU tar in Git Bash does not make a
          # zip at all, so the Windows bsdtar is called explicitly. The folder is what is
          # zipped, so unpacking it gives one directory with everything in it.
          "/c/Windows/System32/tar.exe" -a -c -f "dist/${NAME}.zip" -C dist "${ROOT}"
          cp "dist/${NAME}.${{ matrix.ext }}" .
          echo "ASSET=${NAME}.${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "$ASSET" --clobber

  checksums:
    name: SHA256SUMS.txt
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A checksum file computed before the last upload is a lie, so this job waits for
      # every build and re-downloads what was actually published.
      - name: Collect and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p assets
          gh release download "$TAG" --pattern '*' --dir assets
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum ./* > SHA256SUMS.txt)
          gh release upload "$TAG" assets/SHA256SUMS.txt --clobber

  publish:
    name: Publish
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release edit "$TAG" --draft=false
