name: Release

# A tag is what publishes a release, and the build is what attaches the binaries to it:
# a release cannot exist half-finished, because it is created as a draft and only
# published once every archive and `SHA256SUMS.txt` are on it.
#
# Three platforms, one archive each, from the commit that passed the gate. Nothing else
# lives here — no schedule, no nightly, no signing key, no second artefact shape. The
# Linux build is the oldest Ubuntu LTS, so the glibc it needs is one a supported
# distribution has, and the Windows build links the C runtime statically so the binary
# runs on a machine with no redistributable installed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach binaries to'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  STEM: vn-finance

jobs:
  # The gate calls the workflow a pull request runs rather than a copy of it, so the two
  # cannot drift: a red check stops the release here, before a draft exists to be
  # published.
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Prepare release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          cat > notes.md <<EOF
          Um assistente fiscal local para quem trabalha por conta própria. Uma janela, uma
          pasta de dados, sem rede.

          Descarrega o ficheiro do teu sistema, confirma-o contra o \`SHA256SUMS.txt\`, e
          executa-o. Não há nada a instalar: a aplicação abre o cofre em \`~/.vn-finance\`
          (\`%USERPROFILE%\\.vn-finance\` no Windows) e cria-o no primeiro arranque.

          | Sistema | Ficheiro |
          | --- | --- |
          | Windows 10/11, 64 bits | \`${STEM}-${VERSION}-windows-x86_64.zip\` |
          | macOS 11+, Apple silicon | \`${STEM}-${VERSION}-macos-aarch64.tar.gz\` |
          | Linux, 64 bits (glibc 2.35+) | \`${STEM}-${VERSION}-linux-x86_64.tar.gz\` |

          O binário de Linux precisa das bibliotecas de janelas do sistema (X11 ou Wayland,
          e OpenGL), que qualquer distribuição de ambiente de trabalho já tem.

          O código-fonte de todos estes ficheiros é a etiqueta \`${TAG}\`, sob a GNU AGPL v3.
          EOF
          gh release create "$TAG" --draft --title "${STEM} ${VERSION}" --notes-file notes.md

  build:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            system: windows
            arch: x86_64
            ext: zip
            rustflags: '-C target-feature=+crt-static'
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            system: linux
            arch: x86_64
            ext: tar.gz
            rustflags: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            system: macos
            arch: aarch64
            ext: tar.gz
            rustflags: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      # The window needs the platform's own windowing and graphics libraries on Linux.
      # They are C, and no pure-Rust replacement exists; this is the same list the CI
      # gate installs, and it is the only place the build needs one.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p vnfin --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME="${STEM}-${VERSION}-${{ matrix.system }}-${{ matrix.arch }}"
          ROOT="${STEM}-${VERSION}"
          mkdir -p "dist/${ROOT}"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "dist/${ROOT}/"
          if [ "${{ matrix.system }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/vnfin.exe" "dist/${ROOT}/"
            # bsdtar writes forward-slash entries; the GNU tar in Git Bash does not make
            # a zip at all, so the Windows bsdtar is called explicitly.
            "/c/Windows/System32/tar.exe" -a -c -f "dist/${NAME}.zip" -C dist "${ROOT}"
          else
            cp "target/${{ matrix.target }}/release/vnfin" "dist/${ROOT}/"
            (cd dist && tar -czf "${NAME}.tar.gz" "${ROOT}")
          fi
          cp "dist/${NAME}.${{ matrix.ext }}" .
          echo "ASSET=${NAME}.${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "$ASSET" --clobber

  checksums:
    name: SHA256SUMS.txt
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A checksum file computed before the last upload is a lie, so this job waits for
      # every build and re-downloads what was actually published.
      - name: Collect and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p assets
          gh release download "$TAG" --pattern '*' --dir assets
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum ./* > SHA256SUMS.txt)
          gh release upload "$TAG" assets/SHA256SUMS.txt --clobber

  publish:
    name: Publish
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release edit "$TAG" --draft=false
