[package]
name = "xtask"
description = "The repository's build harness: formatting, lints, tests and the audits CI runs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `cargo metadata` prints JSON, and the notices file is generated from it. This is a
# build-time tool; it is not linked into the application.
serde_json = { workspace = true }
