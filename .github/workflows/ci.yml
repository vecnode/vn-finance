name: CI

# One platform, and it is the one this project ships.
#
# The matrix used to run Ubuntu, Windows and macOS for every pull request. It cost three
# full builds — the window links a platform's graphics stack, so a cold build is not
# cheap — to learn a fact one of them can establish on its own: the Windows job compiles
# and lints the Linux and macOS targets explicitly, which is what catches a `#[cfg]`
# mistake without a runner per platform.
#
# What went with the matrix, and is written down here so it is a decision rather than an
# oversight: the tests themselves no longer *run* on Linux or macOS. The code that ships
# runs on Windows, the same code type-checks for the other two, and a contributor on
# either platform can run `cargo xtask ci` themselves — which is the same command.
#
# `main` ships and `dev` is where work happens: a push to `dev` deliberately runs no
# CI, so a work-in-progress commit costs nothing. A pull request into `main` runs the
# gate, and `main` is protected: pull requests only, no force pushes, no deletions. A
# `v*` tag runs the release workflow, which calls this file first.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    # The name is what a required status check on `main` refers to; renaming it means
    # updating the branch protection with it.
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vn-finance-ci
          cache-on-failure: true

      # The same command a contributor runs: formatting, clippy with warnings
      # denied, the whole test suite, and the audits that keep the no-socket, no-unsafe
      # and corpus-privacy promises true.
      - name: Check
        run: cargo xtask ci

      # A `#[cfg]` bug lives on the platform that is not being compiled. This is what
      # stands in for the two runners that are no longer in the matrix, and it is why
      # dropping them did not drop the cross-platform check — only the cross-platform
      # *execution*. Clippy does not link, so the targets need no native libraries.
      - name: Type-check the other two platforms
        run: |
          rustup target add x86_64-unknown-linux-gnu x86_64-apple-darwin
          cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
          cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings

