# vn-finance mark manifest
#
# Generated from the files in this directory. Every digest is the file's own.
# Regenerate this file whenever a mark or a rendered size changes.

[mark]
name = "vn-finance"
version = "1.0"
date = "2026-11-01"
grid = 24
stroke = 2.914
facets = 6
viewbox = "0 0 24 24"
geometry = "hexagon (12,2.8) (20.8,7.4) (20.8,16.6) (12,21.2) (3.2,16.6) (3.2,7.4); crown ridge (3.2,7.4)-(12,12)-(20.8,7.4); spine (12,2.8)-(12,21.2); girdle (12,15.4)-(3.2,16.6) and (12,15.4)-(20.8,16.6)"

[palette]
cobalt = "#1D4ED8"
cobalt_highlight = "#7BA2FF"
cobalt_deep = "#16339E"
ink = "#0B0D10"
paper = "#FFFFFF"
muted = "#9AA1AC"

[contrast]
white_on_cobalt = "6.70:1"
cobalt_highlight_on_ink = "7.83:1"
white_on_cobalt_deep = "10.49:1"
cobalt_on_ink = "2.90:1 (non-text only)"
cobalt_on_paper = "6.70:1"

[application_icon]
tile_px = 1024
tile_radius_px = 308
mark_scale = 22.73
mark_translate_px = 239.25
tile_fill = "#0B0D10"
ridge = "#FFFFFF"
rgba_px = 64

[suite]
rule = "same crystal, one colour per application"
vn-launcher = "no inlay"
vn-ranger = "ember inlay"
vn-finance = "cobalt inlay"

